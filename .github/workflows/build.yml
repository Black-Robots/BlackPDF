name: Compilar

on:
  push:
    # «prueba/...»: ramas para probar en Windows lo que no se puede probar en Linux, sin publicar nada.
    branches: [main, "prueba/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.15"

jobs:
  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Dependencias del sistema
        # libglu1-mesa, libxcursor1, libxft2 y libxinerama1: las necesita gmsh (STEP e IGES); sin ellas sus pruebas se saltan.
        # libnss3-tools: certutil y pk12util, para crear almacenes de certificados como los de Firefox y Chrome.
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 libglu1-mesa libxcursor1 libxft2 libxinerama1 libnss3-tools
      - name: Dependencias de Python
        run: python -m pip install -e ".[dev]"
      - name: Biblioteca nativa PRC
        run: python native/prc/build.py
      - name: Tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest

  firma-windows:
    # Firmar con el almacén de certificados de Windows (CNG, CryptoAPI y ECDSA): las pruebas crean
    # certificados de prueba en el almacén del usuario y los borran al terminar.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Dependencias de Python
        run: python -m pip install pymupdf pyhanko cryptography pytest
      - name: Pruebas de firma
        shell: pwsh
        run: |
          python -m pytest tests/test_certstore.py tests/test_signatures.py -v -rA --tb=short *>&1 | Tee-Object -FilePath firma.log
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            # Las últimas líneas también como aviso: se pueden leer sin iniciar sesión en GitHub.
            $tail = (Get-Content firma.log -Tail 80) -join "`n"
            $tail = $tail.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error title=Pruebas de firma::$tail"
            exit $code
          }

  windows:
    needs: [tests, firma-windows]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          # Python 3.14, como build_windows_wine.sh: con 3.15, cryptography usa la ABI estable «abi3t»,
          # que en Windows necesita python3t.dll y el programa empaquetado no la incluye.
          python-version: "3.14"
      - name: Inno Setup 6.7.3
        # Versión fija, la misma que en build_windows_wine.sh: el instalador sale igual en local y en CI.
        shell: pwsh
        run: |
          Invoke-WebRequest https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe -OutFile innosetup.exe
          Start-Process .\innosetup.exe -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-','/CURRENTUSER' -Wait
      - name: Compilar instalador
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -File packaging\windows\build_windows.ps1 *>&1 | Tee-Object -FilePath build-windows.log
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            # Las últimas líneas también como aviso: se pueden leer sin iniciar sesión en GitHub.
            $tail = (Get-Content build-windows.log -Tail 60) -join "`n"
            $tail = $tail.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error title=Compilar instalador::$tail"
            exit $code
          }
      - uses: actions/upload-artifact@v5
        with:
          name: BlackPDF-Windows
          path: packaging/out/*.exe

  linux:
    needs: tests
    # Ubuntu 22.04 (glibc 2.35) para que el paquete funcione en distribuciones de 2022 en adelante.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Dependencias
        run: |
          sudo apt-get update
          # gmsh (STEP e IGES) carga libGLU, libXcursor, libXft y libXinerama: PyInstaller empaqueta las que encuentra
          # y la autocomprobación del programa empaquetado lee un STEP.
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libxcb-cursor0 libfontconfig1 libdbus-1-3 dpkg-dev \
            libglu1-mesa libxcursor1 libxft2 libxinerama1
          python -m venv .venv
          .venv/bin/python -m pip install PySide6-Essentials pymupdf pyhanko gmsh pyinstaller
      - name: Compilar AppImage y .deb
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          set -o pipefail
          packaging/linux/build_linux.sh 2>&1 | tee build-linux.log || {
            code=$?
            # Las últimas líneas también como aviso: se pueden leer sin iniciar sesión en GitHub.
            tail -n 60 build-linux.log | sed -e 's/%/%25/g' -e 's/\r/%0D/g' | awk 'BEGIN { ORS = "%0A" } { print }' > tail.txt
            echo "::error title=Compilar AppImage y .deb::$(cat tail.txt)"
            exit $code
          }
      - uses: actions/upload-artifact@v5
        with:
          name: BlackPDF-Linux
          path: |
            packaging/out/*.AppImage
            packaging/out/*.deb

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true
      - name: Sumas de comprobación
        run: cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body_path: RELEASE_NOTES.md
          generate_release_notes: true

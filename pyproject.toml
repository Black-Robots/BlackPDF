[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "blackpdf"
version = "1.3.0"
description = "Free and open desktop PDF viewer and editor that works offline."
readme = "README.md"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
authors = [{ name = "The Black Robots Foundation" }]
requires-python = ">=3.12"
dependencies = [
    "PySide6-Essentials>=6.10",
    "PyMuPDF>=1.26",
    "pyhanko>=0.38",
    # STEP e IGES: OpenCASCADE a través de gmsh (GPL-2.0 o posterior, compatible con la AGPL).
    "gmsh>=4.13",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Environment :: X11 Applications :: Qt",
    "Topic :: Office/Business",
    "Natural Language :: Spanish",
    "Natural Language :: English",
    "Natural Language :: Portuguese (Brazilian)",
    "Natural Language :: French",
]

[project.urls]
Homepage = "https://blackrobots.org/blackpdf"
Source = "https://github.com/Black-Robots/BlackPDF"
Issues = "https://github.com/Black-Robots/BlackPDF/issues"

[project.optional-dependencies]
dev = ["pytest>=8", "pyinstaller>=6.10", "pillow>=11", "cryptography>=48"]

[project.gui-scripts]
blackpdf = "blackpdf.app:main"

[tool.setuptools.packages.find]
include = ["blackpdf*"]

[tool.setuptools.package-data]
blackpdf = ["resources/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "-q"
